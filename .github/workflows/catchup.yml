name: Catch-up Run (manual, one-off)

# Manual trigger only — no schedule. Use this from the Actions tab when a
# real trading day's scanner/tracker runs were both missed entirely.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm you want to run the one-off catch-up (re-plays scanner.py + tracker.py for the last missed trading day)'
        required: true
        default: 'no'

permissions:
  contents: write

jobs:
  catchup:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'yes'
    steps:
      - name: Guard against accidental run
        if: github.event.inputs.confirm != 'yes'
        run: |
          echo "Confirmation input was not 'yes' — aborting without running anything."
          exit 1

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run catch-up (scanner.py then tracker.py, as-of last trading day)
        run: python catchup_run.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trade_book.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Catch-up run: replay missed trading day $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Reminder
        run: |
          echo "Catch-up run complete. This workflow is a one-off recovery tool —"
          echo "delete catchup.yml and catchup_run.py (or just leave them unscheduled)"
          echo "and resume the normal scanner/tracker schedule."
