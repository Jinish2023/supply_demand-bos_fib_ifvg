name: Scanner (4:00 PM IST)

on:
  schedule:
    # 10:30 UTC = 4:00 PM IST, Mon-Fri.
    # NOTE: GitHub Actions cron can run a few minutes late under load -
    # that's fine here since the freshness check inside scanner.py, not
    # wall-clock precision, decides whether to actually act.
    - cron: "30 10 * * 1-5"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python scanner.py

      - name: Commit updated trade book (if changed)
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add data/trade_book.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Scanner: $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Retry with rebase: scanner and tracker both write to the same
          # file and can run close together, so a push can lose a race.
          # The old "git pull --rebase || true" swallowed that failure
          # silently and then pushed anyway - this could drop an update
          # with no visible error. Retry instead, and fail LOUDLY (exit 1)
          # if every attempt fails, so a real problem shows up as a failed
          # Actions run instead of a silently missing commit.
          success=0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then
              success=1
              break
            fi
            echo "Push attempt $i failed (likely racing the other workflow) - retrying in 15s..."
            sleep 15
          done

          if [ "$success" -ne 1 ]; then
            echo "ERROR: failed to push after 5 attempts - this run's update was LOST."
            exit 1
          fi
