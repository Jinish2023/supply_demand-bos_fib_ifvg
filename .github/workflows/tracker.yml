name: Tracker (4:15 PM IST)

on:
  schedule:
    # 10:45 UTC = 4:15 PM IST, Mon-Fri.
    - cron: "45 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        run: python tracker.py

      - name: Commit updated trade book (if changed)
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add data/trade_book.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Tracker: $(date -u +'%Y-%m-%d %H:%M UTC')"

          success=0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then
              success=1
              break
            fi
            echo "Push attempt $i failed (likely racing the other workflow) - retrying in 15s..."
            sleep 15
          done

          if [ "$success" -ne 1 ]; then
            echo "ERROR: failed to push after 5 attempts - this run's update was LOST."
            exit 1
          fi
